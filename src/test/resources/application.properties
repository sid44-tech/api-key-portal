# Don't read the developer's .env: its values outrank this file, so a real
# PORTAL_ENCRYPTION_KEY there would replace the test key below
springdotenv.enabled=false

# Keep tests off the dev database; target/ is wiped by mvn clean
spring.datasource.url=jdbc:sqlite:target/test-keyportal.db?journal_mode=WAL&busy_timeout=5000
# No embedded database on the classpath anymore - use the SQLite URL above as-is
spring.test.database.replace=none

# Test-only credentials, not used anywhere else
portal.security.admin-email=admin@example.com
# BCrypt hash of "test-password"
portal.security.admin-password-hash=$2a$10$bhe3NhHF/7xC1BrBs/PX7uhkxEBk.x5O4yU5.hRNtaB7KzCLOO4Fq
portal.security.admin-group-name=Test group
# Effectively off. The tests that sign in with the wrong password on purpose
# share one application context, and so share the in-memory counters and the one
# loopback address they all call from; left at the real limit they would lock
# each other out. LoginLockoutIntegrationTest sets its own low limit, which
# gives it a context of its own and keeps its counters to itself.
portal.security.lockout.max-attempts=10000

# All-zero key, fine for tests only
portal.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
