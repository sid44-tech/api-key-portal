spring:
  application:
    name: api-key-portal
  datasource:
    url: jdbc:h2:file:./data/keyportal
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

# Secrets come from environment variables or a local .env file (see .env.example).
# The app refuses to start if they're missing.
portal:
  security:
    username: ${env.PORTAL_USERNAME:admin}
    password-hash: ${env.PORTAL_PASSWORD_HASH:}
  encryption:
    # Base64 encoded 256-bit key. Generate one with: openssl rand -base64 32
    key: ${env.PORTAL_ENCRYPTION_KEY:}
