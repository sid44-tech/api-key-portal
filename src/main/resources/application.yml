spring:
  application:
    name: api-key-portal
  datasource:
    # SQLite file in the project folder; set PORTAL_DB_PATH to store it elsewhere.
    # The file is created on first start and reused afterwards. WAL + busy_timeout
    # let the connection pool handle concurrent requests against the single file.
    url: jdbc:sqlite:${PORTAL_DB_PATH:keyportal.db}?journal_mode=WAL&busy_timeout=5000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate's validator can't reconcile SQLite's
      # INTEGER rowid keys with bigint, so validation stays off for SQLite
      # (the postgres profile turns it back on).
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    # db/migration/sqlite or db/migration/postgresql, picked by the driver in use
    locations: classpath:db/migration/{vendor}

spring.servlet.multipart:
  # The one upload is the logo under Appearance, capped at 512 KB by the
  # portal itself; these are the outer bounds the container enforces first.
  max-file-size: 1MB
  max-request-size: 2MB

# Health checks, and nothing else from Actuator: the health endpoint is the one
# thing exposed, anonymously, because that is what a load balancer, container
# runtime or uptime monitor needs. Everything else Actuator could offer stays
# switched off - on a portal full of secrets, "just the metrics" is still a map.
#
#   /actuator/health/liveness   a heartbeat: 200 while the process is up
#   /actuator/health/readiness  database and encryption key - what makes this
#                               instance able to serve; wire orchestrators here
#   /actuator/health            the deep probe: all of the above plus disk, the
#                               SMTP server if one is configured and the SSO
#                               issuer if SSO is on. External trouble makes it
#                               503, which is the point of a deep probe and the
#                               reason not to use it as a readiness check.
#
# Anonymous callers get the status and the HTTP code; a signed-in super admin
# also sees each component and its details.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: SUPER_ADMIN
      group:
        readiness:
          include: readinessState, db, encryption

server:
  port: 8080
  # Whether X-Forwarded-For and friends are believed. Off by default, because
  # believing a header anyone can set would let one caller spread their failed
  # sign-ins across a thousand invented addresses. Set it to "framework" when the
  # portal really is behind a reverse proxy that sets those headers - otherwise
  # every request appears to come from the proxy, and one person guessing badly
  # would lock out everybody behind it.
  forward-headers-strategy: ${PORTAL_FORWARD_HEADERS:none}
  servlet:
    session:
      timeout: 30m
      cookie:
        # The session cookie is the signed-in session; marking it Secure means
        # the browser never sends it over plain HTTP, so a downgraded or
        # mistyped http:// request cannot leak it. Off by default only because
        # a fresh install is reached over plain http://localhost and a Secure
        # cookie would make signing in silently impossible there. Set it to
        # true the moment the portal is behind HTTPS - see the README's
        # "Behind a reverse proxy and HTTPS".
        secure: ${PORTAL_SECURE_COOKIE:false}
        # Script never needs the session cookie; this is Tomcat's default,
        # pinned here so it is a decision rather than an accident.
        http-only: true
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

logging:
  # Every line carries the request it belongs to, who was signed in and where
  # they called from, so a reveal, the sign-in before it and the refusal after
  # it can be tied together. Put in the logging context by AuditContextFilter;
  # empty for work nobody asked for, like the nightly expiry sweep.
  pattern:
    level: "%5p [%X{requestId:-........} %X{user:-anonymous} %X{clientIp:--}]"
  level:
    # The audit trail: sign-ins, reveals, key changes, refusals. Named separately
    # from the application packages so it can be routed and kept on its own -
    # point this logger at its own appender in a logback-spring.xml, or ship
    # lines matching "event=" from wherever the logs already go.
    portal.audit: INFO
    com.sidbhat.apikeyportal: ${PORTAL_LOG_LEVEL:INFO}
    # These print HTTP request and response bodies at DEBUG, and on this portal
    # those bodies are key values, provider credentials and pasted secrets.
    # Pinned at INFO so that turning the application's own logging up - or
    # setting a DEBUG root level to chase a problem - cannot quietly start
    # writing secrets to disk. Raise them deliberately, on a box where that is
    # acceptable, and not for long.
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.http.converter: INFO
    org.springframework.web.client: INFO
  # Logs go to the console, which is where a container wants them. Set
  # LOGGING_FILE_NAME=/var/lib/keyportal/logs/portal.log to also write a file;
  # these decide how it is rolled once you do.
  logback:
    rollingpolicy:
      max-file-size: ${PORTAL_LOG_MAX_SIZE:50MB}
      max-history: ${PORTAL_LOG_MAX_HISTORY:90}
      total-size-cap: ${PORTAL_LOG_TOTAL_SIZE:2GB}

# Secrets come from environment variables or a local .env file (see .env.example).
# The app refuses to start if they're missing.
portal:
  security:
    # Seeds the super admin while the portal has no accounts at all. Sign-up is
    # closed, so a fresh install always gets this one account; everybody else is
    # invited by somebody already in. The default password has to be replaced at
    # the first sign-in - until then that account can reach nothing else.
    # Setting admin-password-hash instead is taken as a deliberate choice and
    # forces no change. PORTAL_USERNAME / PORTAL_PASSWORD_HASH are the
    # pre-multi-user names, still honoured so an upgrade in place doesn't
    # silently lose its login.
    admin-email: ${PORTAL_ADMIN_EMAIL:${PORTAL_USERNAME:admin@localhost}}
    admin-password: ${PORTAL_ADMIN_PASSWORD:changeme}
    admin-password-hash: ${PORTAL_ADMIN_PASSWORD_HASH:${PORTAL_PASSWORD_HASH:}}
    admin-group-name: ${PORTAL_ADMIN_GROUP:Administrators}
    mfa:
      # Two-factor authentication (an authenticator app) for password accounts.
      # Off: each person chooses from their profile. On: an account without one
      # is pinned to the enrolment page at sign-in until it has one. Accounts
      # that sign in through the identity provider are never affected - their
      # second factor is the provider's.
      required: ${PORTAL_MFA_REQUIRED:false}
    lockout:
      # Failed password sign-ins are counted per account and per calling address,
      # and either count reaching the limit refuses further attempts for a while.
      # The same span is the window failures are counted over, so an occasional
      # typo never adds up to a lockout. Counters are in memory, so a restart
      # clears them. The account lock only engages once the failures have come
      # from min-addresses different addresses, so one caller typing wrong
      # passwords at a colleague's email - or the super admin's - locks only
      # their own address, never the account. Set to 1 to lock on count alone.
      max-attempts: ${PORTAL_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-for: ${PORTAL_LOCKOUT_FOR:15m}
      min-addresses: ${PORTAL_LOCKOUT_MIN_ADDRESSES:3}
  invitations:
    # How long an invitation link works for, and who it comes from.
    valid-for: ${PORTAL_INVITE_VALID_FOR:24h}
    from-address: ${PORTAL_MAIL_FROM:no-reply@localhost}
    # Base URL the links point at, e.g. https://keys.example.com. Blank means
    # "whatever address the inviting admin reached the portal on".
    base-url: ${PORTAL_BASE_URL:}
  notifications:
    # Emails key owners a month, two weeks, a week and a day before a key expires.
    # Needs a mail server (SPRING_MAIL_HOST) and a base URL the links can point at.
    enabled: ${PORTAL_EXPIRY_REMINDERS:true}
    cron: ${PORTAL_EXPIRY_REMINDER_CRON:0 0 8 * * *}
    from-address: ${PORTAL_MAIL_FROM:no-reply@localhost}
    base-url: ${PORTAL_BASE_URL:http://localhost:8080}
  rotation:
    # Mints a replacement for an expiring key a week ahead, for owners who have
    # switched it on - per provider on their profile, or per key on its page.
    # Runs an hour before the reminder sweep so a replaced key's owner gets one
    # email ("a replacement is ready") instead of that plus a plain warning.
    # Azure AD and GitLab rotate on their own terms; Google Cloud and AWS keys
    # never expire by themselves, so the same sweep deletes a replaced key at the
    # provider once its date has passed - that is what makes it truly expired.
    enabled: ${PORTAL_AUTO_ROTATION:true}
    cron: ${PORTAL_AUTO_ROTATION_CRON:0 0 7 * * *}
    lead-days: ${PORTAL_AUTO_ROTATION_LEAD_DAYS:7}
  encryption:
    # Base64 encoded 256-bit key. Generate one with: openssl rand -base64 32
    # This single key is all a portal that never rotates needs, and values
    # written under it are stored exactly as they always have been.
    key: ${PORTAL_ENCRYPTION_KEY:}
    # Rotation: name additional keys, then point active-key at the one new
    # values should use. Every value records which key encrypted it, so the old
    # key keeps opening old values while the portal keeps running. Finish with
    #   java -jar api-key-portal.jar --portal.encryption.reencrypt=true
    # and only then drop the old key from configuration.
    #   PORTAL_ENCRYPTION_KEYS_2026A=<base64 key>
    #   PORTAL_ENCRYPTION_ACTIVE_KEY=2026a
    active-key: ${PORTAL_ENCRYPTION_ACTIVE_KEY:}
    # Set by the re-encrypt command only; the portal serves no traffic when true
    reencrypt: ${PORTAL_ENCRYPTION_REENCRYPT:false}
