spring:
  application:
    name: api-key-portal
  datasource:
    url: jdbc:h2:file:./data/keyportal
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

portal:
  security:
    username: ${PORTAL_USERNAME:admin}
    # BCrypt hash of the login password, from PORTAL_PASSWORD_HASH
    password-hash: ${PORTAL_PASSWORD_HASH:}
  encryption:
    # Development key only! Override with PORTAL_ENCRYPTION_KEY anywhere real keys are stored.
    # Generate one with: openssl rand -base64 32
    key: ${PORTAL_ENCRYPTION_KEY:}
