spring:
  application:
    name: api-key-portal
  profiles:
    # Used when no profile is explicitly activated. Anything real should run with
    # its own profile (e.g. "postgres") and supply secrets through the environment.
    default: dev
  datasource:
    url: jdbc:h2:file:./data/keyportal
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

portal:
  security:
    username: ${PORTAL_USERNAME:admin}
    password-hash: ${PORTAL_PASSWORD_HASH:}
  encryption:
    # Base64 encoded 256-bit key. Generate one with: openssl rand -base64 32
    key: ${PORTAL_ENCRYPTION_KEY:}
