spring:
  application:
    name: api-key-portal
  datasource:
    url: jdbc:h2:file:./data/keyportal
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true

server:
  port: 8080

portal:
  encryption:
    # Development key only! Override with PORTAL_ENCRYPTION_KEY anywhere real keys are stored.
    # Generate one with: openssl rand -base64 32
    key: ${PORTAL_ENCRYPTION_KEY:}
