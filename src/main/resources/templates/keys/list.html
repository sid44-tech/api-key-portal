<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Keys</title>
</head>
<body>
<main layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">My keys</h1>
        <a th:href="@{/keys/new}" class="btn btn-primary">Add key</a>
    </div>

    <div class="row mb-4" th:if="${summary.total > 0}">
        <div class="col-sm-4 mb-3 mb-sm-0">
            <div class="card text-center h-100">
                <div class="card-body">
                    <div class="display-4" th:text="${summary.total}">0</div>
                    <div class="text-muted">Keys</div>
                </div>
            </div>
        </div>
        <div class="col-sm-4 mb-3 mb-sm-0">
            <a th:href="@{/keys(sort=EXPIRES)}" class="card text-center h-100 text-decoration-none"
               th:classappend="${summary.expiringSoon > 0} ? 'border-warning'">
                <div class="card-body">
                    <div class="display-4 text-warning" th:text="${summary.expiringSoon}">0</div>
                    <div class="text-muted">Expiring in the next 30 days</div>
                </div>
            </a>
        </div>
        <div class="col-sm-4">
            <a th:href="@{/keys(sort=EXPIRES)}" class="card text-center h-100 text-decoration-none"
               th:classappend="${summary.expired > 0} ? 'border-danger'">
                <div class="card-body">
                    <div class="display-4 text-danger" th:text="${summary.expired}">0</div>
                    <div class="text-muted">Expired</div>
                </div>
            </a>
        </div>
    </div>

    <form th:action="@{/keys}" method="get" class="form-row mb-3">
        <div class="col-md-4 mb-2">
            <label class="sr-only" for="q">Search</label>
            <input type="search" class="form-control" id="q" name="q" th:value="${q}"
                   placeholder="Search by name or service">
        </div>
        <div class="col-md-3 mb-2">
            <label class="sr-only" for="service">Service</label>
            <select class="custom-select" id="service" name="service" onchange="this.form.submit()">
                <option value="">All services</option>
                <option th:each="s : ${services}" th:value="${s}" th:text="${s}"
                        th:selected="${s == service}">GitHub</option>
            </select>
        </div>
        <div class="col-md-3 mb-2">
            <label class="sr-only" for="sort">Sort by</label>
            <select class="custom-select" id="sort" name="sort" onchange="this.form.submit()">
                <option th:each="s : ${sorts}" th:value="${s}" th:text="${'Sort: ' + s.label}"
                        th:selected="${s == sort}">Sort: Service</option>
            </select>
        </div>
        <div class="col-md-2 mb-2">
            <button type="submit" class="btn btn-outline-secondary btn-block">Search</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(keys)}" class="alert alert-info">
        <th:block th:if="${#strings.isEmpty(q) and #strings.isEmpty(service)}">
            No keys yet. <a th:href="@{/keys/new}" class="alert-link">Add your first one.</a>
        </th:block>
        <th:block th:unless="${#strings.isEmpty(q) and #strings.isEmpty(service)}">
            No keys match your search. <a th:href="@{/keys}" class="alert-link">Clear filters</a>
        </th:block>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(keys)}">
        <table class="table table-hover">
            <thead class="thead-light">
            <tr>
                <th scope="col">Service</th>
                <th scope="col">Name</th>
                <th scope="col">Value</th>
                <th scope="col">Created</th>
                <th scope="col">Expires</th>
                <th scope="col" class="text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="key : ${keys}" th:classappend="${key.expirationStatus.name() == 'EXPIRED'} ? 'text-muted'">
                <td th:text="${key.serviceName}">GitHub</td>
                <td><a th:href="@{/keys/{id}(id=${key.id})}" th:text="${key.name}">Deploy token</a></td>
                <td class="key-value">
                    <code class="key-value-text" th:text="${key.maskedValue}">••••••••</code>
                    <button type="button" class="btn btn-sm btn-link js-reveal"
                            th:attr="data-value-url=@{/keys/{id}/value(id=${key.id})}">Show</button>
                    <button type="button" class="btn btn-sm btn-link js-copy"
                            th:attr="data-value-url=@{/keys/{id}/value(id=${key.id})}">Copy</button>
                </td>
                <td th:text="${#temporals.format(key.createdOn, 'MMM d, yyyy')}">Jan 1, 2021</td>
                <td>
                    <span th:text="${key.expiresOn != null ? #temporals.format(key.expiresOn, 'MMM d, yyyy') : 'Never'}">Never</span>
                    <span th:replace="fragments/badges :: expiration(${key})"></span>
                </td>
                <td class="text-right">
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            data-toggle="modal" data-target="#deleteModal"
                            th:attr="data-key-name=${key.serviceName + ' / ' + key.name},data-delete-url=@{/keys/{id}/delete(id=${key.id})}">
                        Delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" id="deleteForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Delete key?</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-0"><strong id="deleteKeyName"></strong> will be permanently removed.
                            This can't be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/keys.js}"></script>
    <script>
        $('#deleteModal').on('show.bs.modal', function (event) {
            var button = $(event.relatedTarget);
            $('#deleteKeyName').text(button.data('key-name'));
            $('#deleteForm').attr('action', button.data('delete-url'));
        });
    </script>
</th:block>
</body>
</html>
