<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Keys</title>
</head>
<body>
<main layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">My keys</h1>
        <a th:href="@{/keys/new}" class="btn btn-primary">Add key</a>
    </div>

    <div th:if="${#lists.isEmpty(keys)}" class="alert alert-info">
        No keys yet. <a th:href="@{/keys/new}" class="alert-link">Add your first one.</a>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(keys)}">
        <table class="table table-hover">
            <thead class="thead-light">
            <tr>
                <th scope="col">Service</th>
                <th scope="col">Name</th>
                <th scope="col">Value</th>
                <th scope="col">Created</th>
                <th scope="col">Expires</th>
                <th scope="col" class="text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="key : ${keys}">
                <td th:text="${key.serviceName}">GitHub</td>
                <td th:text="${key.name}">Deploy token</td>
                <td class="key-value">
                    <code class="key-value-text" th:text="${key.maskedValue}">••••••••</code>
                    <button type="button" class="btn btn-sm btn-link js-reveal"
                            th:attr="data-value-url=@{/keys/{id}/value(id=${key.id})}">Show</button>
                    <button type="button" class="btn btn-sm btn-link js-copy"
                            th:attr="data-value-url=@{/keys/{id}/value(id=${key.id})}">Copy</button>
                </td>
                <td th:text="${#temporals.format(key.createdOn, 'MMM d, yyyy')}">Jan 1, 2021</td>
                <td th:text="${key.expiresOn != null ? #temporals.format(key.expiresOn, 'MMM d, yyyy') : 'Never'}">Never</td>
                <td class="text-right">
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            data-toggle="modal" data-target="#deleteModal"
                            th:attr="data-key-name=${key.serviceName + ' / ' + key.name},data-delete-url=@{/keys/{id}/delete(id=${key.id})}">
                        Delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" id="deleteForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Delete key?</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-0"><strong id="deleteKeyName"></strong> will be permanently removed.
                            This can't be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/keys.js}"></script>
    <script>
        $('#deleteModal').on('show.bs.modal', function (event) {
            var button = $(event.relatedTarget);
            $('#deleteKeyName').text(button.data('key-name'));
            $('#deleteForm').attr('action', button.data('delete-url'));
        });
    </script>
</th:block>
</body>
</html>
