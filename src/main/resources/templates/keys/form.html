<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Add key</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h3 mb-4">Add a key</h1>

            <form th:action="@{/keys}" th:object="${form}" method="post" novalidate>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="serviceName">Service</label>
                        <input type="text" class="form-control" th:field="*{serviceName}"
                               th:errorclass="is-invalid" placeholder="e.g. GitHub" maxlength="100" required>
                        <div class="invalid-feedback" th:errors="*{serviceName}"></div>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:errorclass="is-invalid" placeholder="e.g. CI deploy token" maxlength="100" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="keyValue">Key value</label>
                    <textarea class="form-control text-monospace" th:field="*{keyValue}" rows="3"
                              th:errorclass="is-invalid" autocomplete="off" spellcheck="false" required></textarea>
                    <div class="invalid-feedback" th:errors="*{keyValue}"></div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="createdOn">Created on</label>
                        <input type="date" class="form-control" th:field="*{createdOn}" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{createdOn}"></div>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="expiresOn">Expires on</label>
                        <input type="date" class="form-control" th:field="*{expiresOn}"
                               th:classappend="${#fields.hasErrors('expiresOn') or #fields.hasErrors('expiresOnAfterCreatedOn')} ? 'is-invalid'">
                        <small class="form-text text-muted">Leave blank if the key doesn't expire.</small>
                        <div class="invalid-feedback" th:errors="*{expiresOn}"></div>
                        <div class="invalid-feedback" th:errors="*{expiresOnAfterCreatedOn}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Save key</button>
                <a th:href="@{/keys}" class="btn btn-link">Cancel</a>
            </form>
        </div>
    </div>
</main>
</body>
</html>
