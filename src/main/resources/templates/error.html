<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Error</title>
</head>
<body>
<div layout:fragment="content">
    <div class="kp-error">
        <div class="kp-error-code" th:text="${status}">500</div>
        <h1 class="h4 mb-2">Something went wrong</h1>
        <p class="text-muted mb-4">Nothing was changed. Please try again.</p>
        <a th:href="@{/keys}" class="btn btn-primary">Back to keys</a>
    </div>
</div>
</body>
</html>
