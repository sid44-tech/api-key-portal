<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Error</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-shell">
        <div class="empty-state">
            <div class="empty-state-icon"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></div>
            <h1 class="empty-state-title">Something went wrong</h1>
            <p class="empty-state-text">
                The portal hit an unexpected error<span th:if="${status}"> (<span th:text="${status}">500</span>)</span>.
                Nothing was changed. Try again, and if it keeps happening let an administrator know.
            </p>
            <a th:href="@{/keys}" class="btn btn-primary">Back to keys</a>
        </div>
    </div>
</main>
</body>
</html>
