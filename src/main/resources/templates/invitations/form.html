<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Invite a user</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/invitations}">Invitations</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Invite a user</li>
                </ol>
            </nav>

            <div class="kp-page-header">
                <div>
                    <h1>Invite a user</h1>
                    <p class="kp-subtitle">
                        They'll get an email with a link to set up their account. It's good for 24 hours.
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <th:block th:object="${form}">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
                        </div>
                    </th:block>

                    <form th:action="@{/invitations}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:errorclass="is-invalid" maxlength="255" autofocus required
                                   placeholder="name@example.com">
                            <small class="form-text">This becomes the address they sign in with.</small>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <label class="form-label" for="role">Role</label>
                                <select class="form-select" th:field="*{role}" th:errorclass="is-invalid">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}">Member</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{role}"></div>
                            </div>

                            <div class="mb-3 col-md-6">
                                <label class="form-label" for="groupId">Group</label>
                                <select class="form-select" th:field="*{groupId}" th:errorclass="is-invalid"
                                        th:disabled="${!currentUser.superAdmin}">
                                    <option value="" th:if="${currentUser.superAdmin}">Choose a group</option>
                                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}">Platform team</option>
                                </select>
                                <small class="form-text" th:if="${currentUser.superAdmin}">
                                    Any group in the portal. Add one under <a th:href="@{/groups}">Groups</a>.
                                </small>
                                <small class="form-text" th:unless="${currentUser.superAdmin}">
                                    You can only invite people into your own group.
                                </small>
                                <div class="invalid-feedback" th:errors="*{groupId}"></div>
                            </div>
                        </div>

                        <!-- a disabled select submits nothing, so a group admin's single group is carried here -->
                        <input type="hidden" th:unless="${currentUser.superAdmin}" name="groupId"
                               th:value="${currentUser.groupId}">

                        <div class="d-flex gap-2 mt-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send me-1" aria-hidden="true"></i> Send invitation
                            </button>
                            <a th:href="@{/invitations}" class="btn btn-link">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
