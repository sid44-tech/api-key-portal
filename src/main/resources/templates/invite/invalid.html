<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Invitation not valid</title>
</head>
<body>
<div layout:fragment="content">
    <div class="kp-auth">
        <div class="card">
            <div class="card-body text-center py-5">
                <span class="kp-empty-icon" aria-hidden="true"><i class="bi bi-envelope-slash"></i></span>
                <h1 class="h4 mb-2">This invitation can't be used</h1>
                <p class="text-muted" th:text="${reason}">This invitation link isn't valid.</p>
                <p class="text-muted small mb-4">
                    Invitations last 24 hours and work once. Whoever invited you can send a new one
                    at any time after that.
                </p>
                <a th:href="@{/login}" class="btn btn-secondary">Go to sign in</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
