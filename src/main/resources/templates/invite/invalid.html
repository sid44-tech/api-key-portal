<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Invitation not valid</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-shell">
        <div class="auth-card text-center">
            <div class="empty-state-icon"><i class="bi bi-envelope-slash" aria-hidden="true"></i></div>
            <h1 class="auth-title">This invitation can't be used</h1>
            <p class="auth-subtitle mb-3" th:text="${reason}">
                This invitation link isn't valid.
            </p>
            <p class="text-muted small mb-4">
                Invitations last 24 hours and work once. Whoever invited you can send a new one
                at any time after that.
            </p>
            <a th:href="@{/login}" class="btn btn-outline-secondary w-100">Go to sign in</a>
        </div>
    </div>
</main>
</body>
</html>
