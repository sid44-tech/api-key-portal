<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Set up your account</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-shell auth-shell-wide">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-mark" aria-hidden="true"><i class="bi bi-key-fill"></i></span>
                <h1 class="auth-title">Set up your account</h1>
                <p class="auth-subtitle">
                    You've been invited to join
                    <strong th:text="${invitation.group != null ? invitation.group.name : 'the portal'}">Platform team</strong>
                    as a <span th:text="${#strings.toLowerCase(invitation.role.label)}">member</span>.
                </p>
            </div>

            <p class="text-muted small border rounded-3 p-3 mb-4">
                <i class="bi bi-people me-1" aria-hidden="true"></i>
                Everyone in a group can see each other's key names and expiry dates &mdash; never
                each other's key values.
            </p>

            <th:block th:object="${form}">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
                </div>
            </th:block>

            <form th:action="@{/invite/{token}(token=${token})}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email"
                           th:value="${invitation.email}" autocomplete="username" readonly disabled>
                    <small class="form-text">Fixed by the invitation. This is what you'll sign in with.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="displayName">Your name</label>
                    <input type="text" class="form-control" th:field="*{displayName}"
                           th:errorclass="is-invalid" autocomplete="name" maxlength="100"
                           placeholder="e.g. Alex Carter" autofocus required>
                    <div class="invalid-feedback" th:errors="*{displayName}"></div>
                </div>

                <div class="row">
                    <div class="mb-4 col-md-6">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" th:field="*{password}"
                               th:errorclass="is-invalid" autocomplete="new-password" required>
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-4 col-md-6">
                        <label class="form-label" for="confirmPassword">Confirm password</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('confirmPasswordMatching')} ? 'is-invalid'"
                               autocomplete="new-password" required>
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        <div class="invalid-feedback" th:errors="*{confirmPasswordMatching}"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Create account</button>
            </form>
        </div>

        <p class="auth-footnote">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</main>
</body>
</html>
