<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Not found</title>
</head>
<body>
<div layout:fragment="content">
    <div class="kp-error">
        <div class="kp-error-code">404</div>
        <h1 class="h4 mb-2">That page doesn't exist</h1>
        <p class="text-muted mb-4">It may have been moved or deleted.</p>
        <a th:href="@{/keys}" class="btn btn-primary">Back to keys</a>
    </div>
</div>
</body>
</html>
