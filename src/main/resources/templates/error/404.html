<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Not found</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-shell">
        <div class="empty-state">
            <div class="empty-state-icon"><i class="bi bi-compass" aria-hidden="true"></i></div>
            <h1 class="empty-state-title">Not found</h1>
            <p class="empty-state-text">
                That page or key doesn't exist. It may have been deleted, or the link may be out of date.
            </p>
            <a th:href="@{/keys}" class="btn btn-primary">Back to keys</a>
        </div>
    </div>
</main>
</body>
</html>
