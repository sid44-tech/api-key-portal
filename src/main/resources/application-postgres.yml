spring:
  datasource:
    url: ${PORTAL_DB_URL:jdbc:postgresql://localhost:5432/keyportal}
    username: ${PORTAL_DB_USERNAME:keyportal}
    password: ${PORTAL_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
