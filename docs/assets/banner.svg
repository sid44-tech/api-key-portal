<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Key Management Portal - Store and automate keys and secrets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <!-- key mark -->
  <g transform="translate(110 150)">
    <circle r="62" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <circle r="20" fill="url(#accent)"/>
    <path d="M58 -8 H170 V8 H150 V40 H128 V8 H108 V30 H88 V8 H58 Z" fill="url(#accent)"/>
  </g>
  <text x="330" y="140" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Key Management Portal</text>
  <text x="332" y="192" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="url(#accent)">Store and automate keys and secrets</text>
  <text x="332" y="236" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">Self-hosted · Encrypted · Auto-rotating · Built for teams</text>
</svg>
