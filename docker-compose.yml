version: "3.8"

# Local Postgres for running the app with the "postgres" profile:
#   docker-compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Credentials are read from .env (see .env.example).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: keyportal
      POSTGRES_USER: ${PORTAL_DB_USERNAME:-keyportal}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
